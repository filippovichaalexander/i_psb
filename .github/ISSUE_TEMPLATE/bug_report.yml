name: Bug report
description: Something is broken in firmware, web UI, docs or CAD
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use the private advisory flow
        described in SECURITY.md, not this form.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.1.0 or commit hash"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Symptom, expected behaviour, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial log / screenshot
      description: Paste the full log from reset, not a tail. Redact secrets.
      render: text
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Exact ESP32 board, display, SD, DAC/amp, power path, wiring changes.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
        - label: I removed secrets from logs
