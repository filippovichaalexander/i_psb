[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIPSB_FW_VERSION=\"0.1.0\"
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
    ; Bundles the U8g2 font data (unifont/10x20/cyrillic), no separate U8g2 needed.
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.1
    bblanchon/ArduinoJson@^7.4.0

; Network stack is added in M2/M3 (kept out of the M0 build to reduce risk):
;   h2zero/NimBLE-Arduino@2.5.2
;   ESP32Async/ESPAsyncWebServer@^3.7.0
;   ESP32Async/AsyncTCP@^3.3.0

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -DIPSB_NATIVE=1
lib_deps =
    throwtheswitch/Unity@^2.6.0
